# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Create DahlDesignProperties DLL

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: What Properties version does this correspond to?
        required: true
      is-pre-release:
        type: boolean
        required: true
        description: "is this a prerelease version?"

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4
      
    - uses: actions/cache@v6
      name: Restore Caches
      id: cache
      with:
        path: |
          SimHub.9.12.4.zip
        key: simhub-9.12.4-v3

    - name: Install innounp
      shell: pwsh
      run: |
        if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
        }
        scoop install innounp
        $scoopShims = Join-Path $env:USERPROFILE "scoop\shims"
        Add-Content -Path $env:GITHUB_PATH -Value $scoopShims
        if (-not (Test-Path (Join-Path $scoopShims "innounp.exe"))) {
          throw "Scoop installed innounp, but its executable was not found"
        }

    - name: Download Requirements # Used to download the SimHub DLLs - only if not in cache.
      if: steps.cache.outputs.cache-hit != 'true'
      run: | 
        curl.exe --fail --location --retry 3 --output SimHub.9.12.4.zip "https://github.com/SHWotever/SimHub/releases/download/9.12.4/SimHub.9.12.4.zip"
    
    - name: Extract Requirements
      shell: pwsh
      run: |
        $simHubArchivePath = Join-Path $env:RUNNER_TEMP "simhub"
        $pluginPath = Join-Path $env:GITHUB_WORKSPACE "DLLs"
        $workspaceDrive = Split-Path -Path $env:GITHUB_WORKSPACE -Qualifier
        $simHubPath = Join-Path $workspaceDrive "Program Files (x86)\SimHub"
        $innounpExe = Join-Path $env:USERPROFILE "scoop\shims\innounp.exe"

        if (-not (Test-Path $innounpExe)) {
          throw "Scoop-installed innounp was not found at $innounpExe"
        }
        New-Item -ItemType Directory -Force -Path $simHubArchivePath, $pluginPath, $simHubPath | Out-Null
        7z x SimHub.9.12.4.zip "-o$simHubArchivePath" -y | Out-Null

        $installer = Get-ChildItem -Path $simHubArchivePath -Filter "SimHubSetup_9.12.4.exe" -Recurse | Select-Object -First 1
        if ($null -eq $installer) {
          throw "SimHub installer was not found after extracting the archive"
        }

        $extractArgs = @(
          "-v", "-x", "-b", "-e",
          "-d$pluginPath",
          $installer.FullName,
          "ACSharedMemory.dll", "ACToolsUtilities.dll", "GameReaderCommon.dll",
          "ICarsReader.dll", "InputManagerCS.dll", "iRacingSDK.dll",
          "SimHub.Logging.dll", "SimHub.Plugins.dll", "log4net.dll",
          "MahApps.*.dll", "SharpDX.dll", "Microsoft.Bcl.AsyncInterfaces.dll"
        )

        & $innounpExe @extractArgs
        if ($LASTEXITCODE -ne 0) {
          throw "innounp failed with exit code $LASTEXITCODE"
        }

        $extractedDlls = Get-ChildItem -Path $pluginPath -Filter "*.dll" -Recurse
        Copy-Item -Path $extractedDlls.FullName -Destination $simHubPath -Force
        $requiredDlls = @(
          "ACSharedMemory.dll", "ACToolsUtilities.dll", "GameReaderCommon.dll",
          "ICarsReader.dll", "InputManagerCS.dll", "iRacingSDK.dll",
          "SimHub.Logging.dll", "SimHub.Plugins.dll", "log4net.dll"
        )
        foreach ($dll in $requiredDlls) {
          if (-not (Get-ChildItem -Path $pluginPath -Filter $dll -Recurse)) {
            throw "Required DLL was not extracted: $dll"
          }
        }

    - name: Restore Packages
      run: nuget restore "Dahl Design Properties.sln"

    - name: CopyCsvHelper
      shell: pwsh
      run: |
        $csvHelperPath = Join-Path $env:USERPROFILE ".nuget\packages\csvhelper\30.0.1\*.dll"
        $workspaceDrive = Split-Path -Path $env:GITHUB_WORKSPACE -Qualifier
        $simHubPath = Join-Path $workspaceDrive "Program Files (x86)\SimHub"
        Copy-Item -Path $csvHelperPath -Destination $simHubPath -Force

    - name: Build solution
      run: msbuild "Dahl Design Properties.sln" -t:rebuild -property:Configuration=Release

    - name: Upload Artifact
      uses: ncipollo/release-action@v1
      with:
        artifacts: '${{ github.workspace }}\bin\Release\DahlDesign.dll'
        prerelease: ${{ github.event.inputs.is-pre-release }}
        replacesArtifacts: true
        allowUpdates: true
        name: ${{ github.event.inputs.version }}
        tag: ${{ github.event.inputs.version }}
      
      
    
